name: build

# Run unit tests, go vet and golangci-lint on every push and PR. Cross-compile sanity check
# on tag push runs in release.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: vet
        run: go vet ./...
      - name: embedded skill copy is in sync
        if: runner.os != 'Windows'
        # internal/assets/skill is a go:embed mirror of skills/a2a-bridge
        # (embed cannot reference files outside the package directory).
        run: diff -r skills/a2a-bridge internal/assets/skill
      - name: test
        run: go test ./... -race -count=1
      - name: build
        run: go build ./cmd/a2abridge

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint (tck build tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --build-tags tck
